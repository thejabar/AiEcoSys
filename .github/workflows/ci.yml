name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AiEcoSys.slnx

      - name: Build
        run: dotnet build AiEcoSys.slnx -c Release --nologo

      - name: Test
        run: dotnet test AiEcoSys.slnx -c Release --nologo
